# Test, then build and publish the container image to GitHub Container Registry.
#
#   push to main      -> ghcr.io/<owner>/secure-media-gallery:edge
#   tag v1.2.3        -> :1.2.3, :1.2, :1 and :latest
#
# Uses the built-in GITHUB_TOKEN; no secrets to configure. After the first run,
# check the package's visibility under GitHub → Packages (public images can be
# pulled by Unraid without logging in).

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Poetry and dependencies
        run: |
          pipx install poetry==2.4.1
          poetry install --no-root
      - name: Lint
        run: |
          poetry run ruff check
          poetry run ruff format --check
      - name: Tests
        run: poetry run pytest

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
